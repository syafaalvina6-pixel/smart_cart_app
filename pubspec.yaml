name: fashion_store
description: "Aplikasi E-Catalog Fashion Store"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Database SQLite (Untuk Android & iOS)
  sqflite: ^2.3.0

  # Helper untuk path database
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset gambar lokal bawaan LKPD
  assets:
    - assets/hoodie_23.jpg